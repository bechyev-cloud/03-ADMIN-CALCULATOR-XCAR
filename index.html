<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050708"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>XCAR Управление</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#050708;color:#f4f7f8}button,input,textarea{font:inherit}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:28px;font-weight:900}.muted{color:#94a0a5}.panel{background:#0d1214;border:1px solid #1d292d;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 14px 40px #0008}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border-radius:15px;background:#111a1d}.stat b{font-size:25px;display:block}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input{width:100%;background:#090d0f;border:1px solid #29373b;color:#fff;padding:12px;border-radius:12px}.btn{border:0;border-radius:12px;padding:11px 14px;background:#e7f6f5;color:#071011;font-weight:800;cursor:pointer}.btn.green{background:#28d391}.btn.red{background:#ff5d69;color:white}.btn.dark{background:#182327;color:#fff}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid #202c30;text-align:left}.badge{padding:5px 8px;border-radius:999px;background:#182327;font-size:12px}.ok{color:#2fe29a}.danger{color:#ff6570}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.table{font-size:13px}.hideMob{display:none}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">XCAR <span class="muted">SUPER ADMIN</span></div><div class="muted">Пользователи · подписки · заявки · сообщения · резервные копии</div></div><button class="btn dark" onclick="location.reload()">Обновить</button></div><div id="login" class="panel"><h2>Вход администратора</h2><input id="u" class="input" placeholder="Логин"><br><br><input id="p" class="input" type="password" placeholder="Пароль"><br><br><button class="btn" onclick="login()">Войти</button><div id="lh" class="muted"></div></div><div id="app" style="display:none"><div class="grid"><div class="stat"><span class="muted">Пользователи</span><b id="sUsers">0</b></div><div class="stat"><span class="muted">Заявки</span><b id="sReq">0</b></div><div class="stat"><span class="muted">Заблокировано</span><b id="sBlock">0</b></div><div class="stat"><span class="muted">Бесплатный старт</span><b>30 дней</b></div></div><div class="tabs"><button class="btn tab" onclick="show('users')">Пользователи</button><button class="btn dark tab" onclick="show('req')">Заявки</button><button class="btn dark tab" onclick="show('msg')">Сообщение</button><button class="btn dark tab" onclick="backup()">Резервная копия</button></div><div id="users" class="panel"><h2>Пользователи</h2><div id="usersBox"></div></div><div id="req" class="panel" style="display:none"><h2>Заявки на подписку</h2><div id="reqBox"></div></div><div id="msg" class="panel" style="display:none"><h2>Сообщение пользователю</h2><input id="mid" class="input" placeholder="ID пользователя"><br><br><textarea id="mtext" class="input" rows="4" placeholder="Текст сообщения"></textarea><br><br><button class="btn" onclick="sendMsg()">Отправить</button><div id="mh" class="muted"></div></div></div></div><script>
let auth='';async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:auth};return fetch('/api'+path,opt)}function login(){auth='Basic '+btoa((u.value||'')+':'+(p.value||''));api('/admin/users').then(r=>{if(!r.ok)throw 0;login.style});}
async function doLogin(){ }
window.login=async()=>{auth='Basic '+btoa((document.getElementById('u').value||'')+':'+(document.getElementById('p').value||''));const r=await api('/admin/users');if(!r.ok){document.getElementById('lh').textContent='Неверные данные';return}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load();};
async function load(){const [u,r]=await Promise.all([api('/admin/users'),api('/admin/requests')]);const ud=await u.json(),rd=await r.json();document.getElementById('sUsers').textContent=ud.users.length;document.getElementById('sReq').textContent=rd.requests.filter(x=>x.status==='pending').length;document.getElementById('sBlock').textContent=ud.users.filter(x=>x.blocked).length;document.getElementById('usersBox').innerHTML='<table class="table"><tr><th>ID</th><th>Логин</th><th>Подписка</th><th>Статус</th><th>Действия</th></tr>'+ud.users.map(x=>`<tr><td>${x.id}</td><td>${x.username}</td><td>${x.subscription_until?new Date(x.subscription_until).toLocaleDateString('ru-RU'):'—'}</td><td>${x.blocked?'<span class="danger">Заблокирован</span>':'<span class="ok">Активен</span>'}</td><td><button class="btn dark" onclick="days(${x.id})">+ дни</button> <button class="btn ${x.blocked?'':'red'}" onclick="block(${x.id},${!x.blocked})">${x.blocked?'Разблок.':'Блок'}</button> <button class="btn red" onclick="del(${x.id})">Удалить</button></td></tr>`).join('')+'</table>';document.getElementById('reqBox').innerHTML=rd.requests.map(x=>`<div class="panel"><b>#${x.id} · ${x.username}</b><div>${x.name} · ${x.phone}</div><div>${x.months} мес. · ${x.price} ₽ · <span class="badge">${x.status}</span></div>${x.status==='pending'?`<br><button class="btn green" onclick="decide(${x.id},'approved')">Принять</button> <button class="btn red" onclick="decide(${x.id},'rejected')">Отклонить</button>`:''}</div>`).join('')||'<span class="muted">Заявок нет</span>';}
async function days(id){const d=prompt('Сколько дней добавить?',30);if(d)await api('/admin/users/'+id+'/subscription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({days:Number(d)})});load()}async function block(id,b){await api('/admin/users/'+id+'/block',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({blocked:b})});load()}async function del(id){if(confirm('Удалить пользователя?')){await api('/admin/users/'+id,{method:'DELETE'});load()}}async function decide(id,status){await api('/admin/requests/'+id+'/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}async function sendMsg(){const r=await api('/admin/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:Number(document.getElementById('mid').value),message:document.getElementById('mtext').value})});document.getElementById('mh').textContent=r.ok?'Отправлено ✓':'Ошибка'}function show(id){['users','req','msg'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none')}function backup(){location.href='/api/admin/backup'}
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));}</script></body></html>
